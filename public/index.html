<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patchwork 9</title>

  <!-- p5.js does the drawing. Same version as patchwork8, so nothing new to learn. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>

  <style>
    /* The collage is bigger than the window: scroll to see the rest. */
    body { margin: 0; background: #fff; }
    canvas { display: block; }

    /* The bin stays in the window's corner wherever you scroll. */
    #trash { position: fixed; right: 20px; bottom: 20px; width: 80px; pointer-events: none; }

    /* One small line of help in the corner. That is the whole interface. */
    #help { position: fixed; left: 12px; bottom: 10px; font: 14px sans-serif; }

    /* The two "add" words look like links: underlined, clickable.
       The real file picker is hidden inside each one. WHY: the browser's
       own picker button is big and grey; clicking a word is simpler. */
    #help label { text-decoration: underline; cursor: pointer; }
    #help input { display: none; }
    #help a { text-decoration: underline; cursor: pointer; }

    /* The gallery: a strip down the left side with every PNG of the cutouts folder.
       Click a picture to paste it in the middle, or drag it onto the page. */
    #gallery {
      position: fixed; left: 0; top: 0; bottom: 36px; width: 180px;
      overflow-y: auto; background: rgba(255,255,255,0.95);
      border-right: 1px solid #ddd; padding: 8px; box-sizing: border-box;
      font: 13px sans-serif; display: none;
    }
    #gallery.open { display: block; }
    #gallery .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    #gallery img {
      width: 100%; aspect-ratio: 1; object-fit: contain; cursor: grab;
      background: #f4f4f4; border-radius: 4px;
    }
    #gallery img:hover { outline: 2px solid #000; }
  </style>
</head>
<body>
  <div id="help">
    Drag a piece to move it. Space: new collage. S: save as PNG.
    <!-- Clicking the word opens the file picker hidden inside it.
         "multiple" lets you pick several PNGs at once.
         onchange runs once you have picked: it hands the files to sketch.js.
         value = '' empties the picker, so the same PNG can be added twice. -->
    <label>Add PNG cutout (multiply)
      <input type="file" accept="image/png" multiple
             onchange="addPngs(this.files, cutouts, addRepeated); this.value = ''">
    </label>
    ·
    <label>Add PNG cutout (unique)
      <input type="file" accept="image/png" multiple
             onchange="addPngs(this.files, oneOffs, addOneOff); this.value = ''">
    </label>
    ·
    <a onclick="document.getElementById('gallery').classList.toggle('open')">Gallery</a>
  </div>

  <!-- Filled in by sketch.js with the PNGs of the cutouts folder. -->
  <div id="gallery">
    Click or drag a picture onto the page.
    <label><input type="checkbox" id="galleryMultiply"> multiply</label>
    <div class="grid"></div>
  </div>

  <img id="trash" src="cutouts/trashasset1.png" alt="Bin">

  <!-- All the code is in this one file. -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
